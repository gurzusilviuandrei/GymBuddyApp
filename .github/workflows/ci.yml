# Runs on every push and pull request. A red check means: don't merge or ship.
name: Checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Database and security tests
        run: npm test
      - name: Build the app bundle
        run: npm run build
        env:
          # Public placeholders: the build only needs values to exist.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build and copy the app into Android
        run: npm run app:sync
        env:
          # The real project, so the APK attached to each run can log in. Both values
          # are public by design (they ship inside every copy of the app).
          VITE_SUPABASE_URL: https://uoljwupvesnnsjipnzyn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wRHNLX3Jo49IcuWO-JYmKQ_Z05uBuB3
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gymbuddy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
