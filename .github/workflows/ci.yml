# Runs on every push and pull request. A red check means: don't merge or ship.
name: Checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Database and security tests
        run: npm test
      - name: Build the app bundle
        run: npm run build
        env:
          # Public placeholders: the build only needs values to exist.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  android:
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Build and copy the app into Android
        run: npm run app:sync
        env:
          # The real project, so the APK attached to each run can log in. Both values
          # are public by design (they ship inside every copy of the app).
          VITE_SUPABASE_URL: https://uoljwupvesnnsjipnzyn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wRHNLX3Jo49IcuWO-JYmKQ_Z05uBuB3
          VITE_SENTRY_DSN: https://339fd206883f6489807d93e7ae2feeef@o4512205215694849.ingest.de.sentry.io/4512205230112848
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: gymbuddy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
