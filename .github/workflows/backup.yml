# Weekly backup of the live database (the Supabase free plan has no restorable backups).
# Saves the members' data (public schema) and their accounts (auth schema), encrypts the file
# with BACKUP_PASSPHRASE and keeps it as a download for 90 days. Run by hand any time:
# Actions → Backup → Run workflow. How to restore: README → "Backups".
#
# Needs two repository secrets, added by the owner (never pasted in chat or committed):
#   SUPABASE_DB_URL     the "Session pooler" connection string (Supabase → Connect), password included
#   BACKUP_PASSPHRASE   a long passphrase kept somewhere safe; without it a backup can't be opened
name: Backup

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets are there
        run: |
          missing=""
          [ -n "$SUPABASE_DB_URL" ] || missing="$missing SUPABASE_DB_URL"
          [ -n "$BACKUP_PASSPHRASE" ] || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Add the repository secret(s):$missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # Catch a connection string pasted into the passphrase by mistake, or a weak passphrase.
          case "$BACKUP_PASSPHRASE" in
            postgres://*|postgresql://*) echo "::error::BACKUP_PASSPHRASE holds a connection string. Put your passphrase there."; exit 1 ;;
          esac
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE is shorter than 16 characters. Use a longer passphrase."
            exit 1
          fi

      # pg_dump must be at least as new as the server; 17 also reads older servers.
      - name: Install the PostgreSQL 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Counts only: no personal data in the log.
      - name: Count what is being saved
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "
            select 'accounts', count(*) from auth.users
            union all select 'profiles', count(*) from public.users
            union all select 'sets', count(*) from public.workout_logs
            union all select 'workouts', count(*) from public.workout_sessions
            union all select 'machine settings', count(*) from public.user_machine_settings;"

      - name: Dump and encrypt
        id: dump
        run: |
          name="gymbuddy-db-$(date -u +%Y-%m-%d)"
          umask 077
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --file="$RUNNER_TEMP/$name.dump"
          # A real dump is never this small; stop rather than keep an empty "backup".
          size=$(stat -c %s "$RUNNER_TEMP/$name.dump")
          if [ "$size" -lt 10000 ]; then echo "::error::The dump is only $size bytes."; exit 1; fi
          pg_restore --list "$RUNNER_TEMP/$name.dump" > /dev/null
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$name.dump.gpg" "$RUNNER_TEMP/$name.dump" <<< "$BACKUP_PASSPHRASE"
          rm -f "$RUNNER_TEMP/$name.dump"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Saved $name.dump.gpg ($(stat -c %s "$name.dump.gpg") bytes, encrypted)."

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dump.outputs.name }}
          path: ${{ steps.dump.outputs.name }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
